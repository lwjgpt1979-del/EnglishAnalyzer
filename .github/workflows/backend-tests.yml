name: backend-tests

# 后端测试(含 R10 语法流程审计 tests/services/test_grammar_flow.py)
on:
  push:
    paths: ["backend/**", "tests/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", "tests/**", ".github/workflows/backend-tests.yml"]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enggramer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # 仅 database_url / async_database_url 为必填;其余 settings 走默认,
      # LLM/图片 key 用占位符 → is_*_dev_mode()=True,测试离线确定。
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/enggramer_test
      ASYNC_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/enggramer_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DB migrate
        working-directory: backend
        run: alembic upgrade head

      - name: Run grammar-flow audit tests
        working-directory: backend
        # 先收窄为 R10 语法流程审计(纯回归守卫,保证稳定绿);
        # 既有全量套件在 CI 里调通后,可放开为 `python -m pytest ../tests -q`。
        run: python -m pytest ../tests/services/test_grammar_flow.py -q
