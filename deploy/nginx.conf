# deploy/nginx.conf

# HTTP: ACME challenge pass-through + redirect everything else to HTTPS
server {
    listen 80;
    server_name api.goodgrammar.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: SSL termination + reverse proxy to FastAPI backend
server {
    listen 443 ssl;
    server_name api.goodgrammar.top;

    ssl_certificate     /etc/letsencrypt/live/api.goodgrammar.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.goodgrammar.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Backend doesn't receive image binaries (COS direct-upload), 10m is ample
    client_max_body_size 10m;

    location / {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
